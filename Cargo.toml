[package]
name = "pokebonk-lolka"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Сообщает в канал Lolka о забегах игроков Pokebonk"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
